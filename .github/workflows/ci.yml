# OpenRayNux CI.
#
# # Two lanes on the PR path, and why
#
# * `pr` runs on every change. It is the lane that has to be fast enough that
#   people do not batch commits to avoid it, so it does the full Linux gate set
#   and nothing else.
# * `windows-check` runs `cargo check` only, once a night. Full Windows test
#   parity is deferred because the GUI arrives in Phase 6 and WebView2 needs a
#   real Windows runner (docs-13 §5, ADR-0026). Checking nightly rather than per
#   PR keeps Windows-specific breakage from blocking unrelated work.
#
# A third lane, `windows-portability`, runs the Windows *behaviour* tests for the
# crates that are platform-neutral. It is PR-path because it is cheap and because
# "the core is portable" is the architectural claim whose silent failure costs the
# most (ADR-0026: a Linux-only CI with a "should work on Windows" claim is untested
# and untrue). Its exclusions are enumerated in the job, with a reason each.
#
# # `CI: true` matters
#
# `scripts/ci-gates.sh` skips a gate whose tool is missing unless `CI` is set. In
# CI a missing tool is therefore a hard failure rather than a silent skip — the
# whole failure mode being prevented is a green build that checked less than it
# claimed to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC daily. Not on the hour: scheduled runs cluster at :00, and the
    # queue is longer than the work.
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a PR supersedes the previous run. Without this, a five-commit
# series burns five full gate runs to produce one result nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Reproducible builds: no incremental state carried between CI machines, and no
  # absolute paths baked into the output.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  linux-gates:
    name: Linux gates (G1-G11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cargo semver-checks needs history; audit needs tags

      # rust-toolchain.toml pins the version, so this reads it rather than
      # duplicating it. A second place to update is a second place to forget.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the portable-core target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the gate tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked
          cargo install cargo-semver-checks --locked
          cargo install cargo-nextest --locked

      # What this runner can actually do, before anything is inferred from a red test.
      #
      # `bwrap` is preinstalled on `ubuntu-latest` but cannot create a user namespace
      # there, so a host-level `bwrap --version` check would report success on a runner
      # that can isolate nothing — which is exactly how two governed CLI tests came to
      # fail with no visible reason. The suites are environment-aware and assert whichever
      # property is true here (a refusal, on a host that cannot isolate), so this step
      # exists to make the *reason* legible rather than to gate anything.
      #
      # Deliberately not `--require`: this host is allowed to be incapable, and the lane
      # that must execute Tier-1 work is the container job below.
      #
      # Placed *before* the gates on purpose. A diagnostic that runs after a failing step
      # is a diagnostic nobody reads, and the whole point is to explain exactly the runs
      # that need explaining.
      - name: Report this runner's sandbox capability
        run: ./scripts/preflight.sh

      # The gates script is the single source of truth; CI invokes it rather than
      # re-implementing the checks. A duplicated gate drifts from the local one.
      - name: Run the gates
        env:
          CI: "true"
        run: ./scripts/ci-gates.sh

      # V-25's resource baseline. Reported, not gated on this runner.
      #
      # `continue-on-error` is deliberate and the reason is in docs-05 §8: a
      # measurement that blocks a commit because a hosted runner was busy teaches
      # engineers to ignore it. What this step does guarantee is that the harness
      # itself stays runnable and that its own order-of-magnitude assertions -- which
      # are 10x bounds, not budget bounds -- still fail loudly.
      #
      # The two numbers that *are* deterministic (binary size is a file size; the
      # dependency graph is a graph) are checked without `continue-on-error` below,
      # because a regression there is a real regression rather than a noisy one.
      - name: Measure the V-25 resource baseline
        id: v25
        continue-on-error: true
        run: ./scripts/measure-v25.sh

      - name: Report the V-25 baseline
        if: always()
        # Single-quoted: a backtick fence inside double quotes is command substitution in
        # bash, and an odd number of them is a syntax error rather than a fence. The first
        # version of this step failed the whole job on exactly that.
        run: |
          {
            echo '### V-25 resource baseline (informational)'
            echo ''
            echo 'Hosted runners are slower than the reference machine docs-05 names, so'
            echo 'these are reported and compared, never gated.'
            echo ''
            echo '```'
            echo 'commit: ${{ github.sha }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build documentation
        # Missing docs are denied in the crates, and `cargo doc` also catches
        # broken intra-doc links, which nothing else does.
        #
        # `-D warnings` is load-bearing. Without it `broken_intra_doc_links`
        # defaults to *warn*, so this step exits 0 with any number of broken links
        # and the check cannot fail -- which is the thing
        # `scripts/ci-gates.sh`'s own header calls "a check that cannot fail is
        # not a gate". Thirty broken links survived here before it was set.
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  windows-check:
    name: Windows cargo check (nightly)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Check, not build or test: the MSVC target has no working linker for every
      # dependency on a bare runner, and Phase 1's Windows requirement is that the
      # code *compiles* for MSVC — a Windows-incompatible construct would show up
      # here. Anything deeper arrives with the GUI (docs-13 §5).
      - name: cargo check for MSVC
        run: cargo check --workspace --all-targets

  # A focused Windows *behaviour* lane, separate from the nightly check.
  #
  # # Why these crates and not the workspace
  #
  # Three groups are deliberately excluded, each for a stated reason rather than for
  # convenience. A Windows job that quietly skips the hard parts is worse than no job.
  #
  # 1. `orxnud-platform-sandbox` integration tests, `orxnud-capability`'s
  #    `governed_path`, and `orxnud-task`'s measurements are **Linux evidence**:
  #    `bwrap`, `/bin/sh`, `/proc/self/fd`, `/usr/bin/python3`, `/proc/mounts`.
  #    They compile for MSVC (`--all-targets` above proves it) and would measure
  #    Linux kernel behaviour on a host that has none. Not applicable.
  # 2. `orxnud-platform-secrets` needs a real credential store. Its tests are written
  #    to tolerate either answer, so it is not *broken* here, but a Windows keyring
  #    result is evidence that belongs in the verification register (V-29), not
  #    something this lane may be the first to assert.
  # 3. `orxnud-store` and everything above it (`task`, `policy`, `audit`,
  #    `capability`, `daemon`) builds a bundled SQLite through `cl.exe`. It compiles
  #    on this runner; running it would need the native tests to be proven portable
  #    first, and they are not (see group 1).
  #
  # # What this lane does prove
  #
  # That the portable core, the configuration layer, the CLI, and the filesystem and
  # notification adapters *behave* — not merely compile — on Windows. That is the claim
  # V-29 needs, and `cargo check` cannot make it.
  windows-portability:
    name: Windows portability tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Portable-core and adapter tests
        run: >-
          cargo test
          -p orxnud-domain
          -p orxnud-protocol
          -p orxnud-config
          -p orxnud-obs
          -p orxnuctl
          -p orxnud-platform-fs
          -p orxnud-platform-notify

      # The platform dispatch itself: that a host without a sandbox backend refuses a
      # Tier-1 execution, and that `SandboxSpec`'s default working directory is
      # absolute on this platform. Both are platform-neutral assertions that a
      # Windows host must also satisfy.
      - name: Sandbox platform-dispatch tests
        run: cargo test -p orxnud-platform-sandbox --lib

  # The Tier-1 sandbox suites, in a second, explicitly-labelled environment.
  #
  # # Why this job exists
  #
  # The `linux-gates` job above runs on the runner host, which cannot create a user
  # namespace, so every Tier-1 dispatch there is *refused* — correctly, but it means that
  # job cannot show that a Tier-1 capability actually executes under isolation. Something
  # has to, or the governed path has no positive evidence anywhere in CI.
  #
  # # Why a container, and why not `--privileged`
  #
  # Measured, not assumed: with `--privileged` or `--cap-add=SYS_ADMIN` the probe passes,
  # but `bwrap` then runs *without* creating a user namespace — the identity inside the
  # sandbox is the full map `0 0 4294967295` instead of the production `1000 0 1`. That is
  # a materially weaker claim about the security boundary and would not be evidence that
  # the path users run works. So the container grants nothing: two runtime-only
  # relaxations (Docker's seccomp blocks `unshare(CLONE_NEWUSER)`, and Docker's masked
  # `/proc` paths make a nested procfs mount illegal), and the tests then run as an
  # unprivileged uid with every capability dropped, which forces `bwrap` to nest a user
  # namespace exactly as on a desktop. The full measurement table is in
  # `scripts/run-sandbox-tests.sh`; the reasons are not repeated here.
  #
  # # Why it cannot pass quietly
  #
  # The lane runs `preflight --require` first, which exits non-zero unless a Tier-1
  # capability can be sandboxed here *and* the observed identity is the nested shape. If
  # this environment ever stops reproducing production, the job fails saying so instead of
  # running a reduced suite and going green.
  sandbox-integration:
    name: Tier-1 sandbox (production configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: sandbox-integration

      # A cold build of the workspace, including bundled SQLite. Cached after the first
      # run, which is why the timeout is generous rather than tight.
      #
      # On `ubuntu-latest` this job currently *reports* that the environment cannot create
      # an unprivileged user namespace and produces no positive Tier-1 evidence -- measured,
      # not assumed, and printed on every run. It still runs because the measurement is the
      # point: it is the only place the gap is recorded against the exact image it happens
      # on. It is not made green by disabling AppArmor or granting a capability, both of
      # which `scripts/run-sandbox-tests.sh` declines in more words.
      - name: Measure the environment and run the Tier-1 suites if it can isolate
        run: ./scripts/run-sandbox-tests.sh

  # A dedicated lane for the portable-core claim, because it is the one gate whose
  # failure would invalidate an architectural claim rather than just a build.
  portable-core:
    name: Portable core builds for wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the portable core
        run: cargo check -p orxnud-domain -p orxnud-protocol --target wasm32-unknown-unknown
