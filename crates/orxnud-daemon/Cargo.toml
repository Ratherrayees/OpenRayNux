[package]
name = "orxnud-daemon"
description = "OpenRayNux composition root: wiring, supervision, lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# The API key is wrapped in `Zeroizing` so it is wiped on drop rather than left in
# freed heap. The workspace already depends on it; this is the first daemon-side use.
zeroize = { workspace = true }
# The provider's single outbound connection may be TLS. Nothing else in the daemon
# opens a socket to the network, so the dependency is confined to `http_provider`.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-native-certs = { workspace = true }
orxnud-domain = { workspace = true }
orxnud-protocol = { workspace = true }
orxnud-store = { workspace = true }
orxnud-policy = { workspace = true }
orxnud-task = { workspace = true }
orxnud-capability = { workspace = true }
orxnud-audit = { workspace = true }
orxnud-config = { workspace = true }
orxnud-obs = { workspace = true }
orxnud-platform-fs = { workspace = true }
orxnud-platform-secrets = { workspace = true }
orxnud-platform-notify = { workspace = true }
orxnud-platform-ipc = { workspace = true }
orxnud-platform-sandbox = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Generates the self-signed certificate the HTTPS suite needs. A committed PEM would
# fail G10 (no private keys in the tree) and a hand-rolled generator would be a
# second implementation of X.509 that nobody here should maintain.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The runtime integration suite opens the runtime's own SQLite file to count the
# records it persisted, so it uses the real store rather than a re-implementation
# of the query.
orxnud-store = { workspace = true }
# Dev-only, and for the same reason: the execution-certainty suite drives a dispatch
# failure through the real reservation, resolution and recovery against a real file,
# which is the only way to assert that a verdict reaches `needs-verification` rather
# than only that a function returns a value. Opening the file is a `rusqlite`
# operation and the store does not re-export the handle type. `orxnud-capability` and
# `orxnud-task` already take the same dev-dependency for the same reason, and G2 reads
# `[dependencies]` only, so this cannot widen the layer graph.
rusqlite = { workspace = true }

# The one canonical long-lived process. `orxnuctl` is the command-line client and
# depends only on `orxnud-protocol`, so the two do not compete for the same role.
[[bin]]
name = "orxnud"
path = "src/main.rs"
