[package]
name = "orxnud-store"
description = "OpenRayNux SQLite persistence: repositories, migrations, backup/restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Deterministic crash injection *inside* a repository transaction. Off by default,
# not a default feature, and not enabled by any release profile. See src/faults.rs
# for why a hook is the only way to test mid-transaction atomicity, and
# tests/fault_feature_is_not_shipped.rs for the check that it stays off.
fault-injection = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `bundled` compiles SQLite from the pinned amalgamation. The system library is
# never used: Fedora 44 ships 3.51.2, which is below the 3.51.3 WAL-reset
# corruption fix (ADR-0006, V-02).
rusqlite = { workspace = true }
orxnud-domain = { workspace = true }

# Build-time only. Cargo exports a `links = "sqlite3"` package's metadata to
# **build scripts of packages that depend on it directly**, so a
# `[build-dependencies]` entry is not enough: `DEP_SQLITE3_INCLUDE` never arrives
# and `build.rs` cannot find the header. It must be a normal dependency.
#
# That sounds wrong for something never used in code, but the dependency is not
# referenced by any Rust source: it exists solely so `build.rs` can read
# `DEP_SQLITE3_INCLUDE`. `unused_crate_dependencies` is off for this reason.
libsqlite3-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
