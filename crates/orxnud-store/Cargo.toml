[package]
name = "orxnud-store"
description = "OpenRayNux SQLite persistence: repositories, migrations, backup/restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Deterministic crash injection *inside* a repository transaction. Off by default,
# not a default feature, and not enabled by any release profile. See src/faults.rs
# for why a hook is the only way to test mid-transaction atomicity, and
# tests/fault_feature_is_not_shipped.rs for the check that it stays off.
fault-injection = []
# The raw migration SQL: `MIGRATIONS` and the `schema::MIGRATION_*` DDL it hands out.
#
# Off by default, for the same reason as `fault-injection` and with the same
# consequence if it leaks: every one of these strings is a `CREATE TABLE` /
# `ALTER TABLE` that a caller can execute on a live database with no
# pre-migration snapshot and no recovery. Shipping them makes "the schema can
# only be changed through the snapshotting path" a convention rather than a
# fact, which is exactly the shape S-11 was raised about.
#
# It exists because integration tests in *other* crates need to stage a database
# at a chosen schema version, and `#[cfg(test)]` is not visible across a crate
# boundary. Resolver 3 does not unify a dev-dependency's features into a normal
# build, so enabling it from `[dev-dependencies]` cannot ship it.
#
# See tests/test_support_feature_is_not_shipped.rs.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `bundled` compiles SQLite from the pinned amalgamation. The system library is
# never used: Fedora 44 ships 3.51.2, which is below the 3.51.3 WAL-reset
# corruption fix (ADR-0006, V-02).
rusqlite = { workspace = true }
orxnud-domain = { workspace = true }

# Build-time only. Cargo exports a `links = "sqlite3"` package's metadata to
# **build scripts of packages that depend on it directly**, so a
# `[build-dependencies]` entry is not enough: `DEP_SQLITE3_INCLUDE` never arrives
# and `build.rs` cannot find the header. It must be a normal dependency.
#
# That sounds wrong for something never used in code, but the dependency is not
# referenced by any Rust source: it exists solely so `build.rs` can read
# `DEP_SQLITE3_INCLUDE`. `unused_crate_dependencies` is off for this reason.
libsqlite3-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# S-31's two-process tests seed a real database before handing it to the role child.
# Already a dependency of this crate; listed here because integration tests do not
# inherit regular dependencies.
rusqlite = { workspace = true }
# Dev-only, and for the alias-safety tests (ADR-0058): the store's open requires a
# filesystem-identity capability, and the strongest evidence is the **real** platform
# implementation answering about a **real** hard link. A fake would prove the store's
# logic and nothing about the implementation that ships.
#
# G2 reads `[dependencies]` only, so this cannot widen the shipped layer graph: the
# store still depends on `orxnud-domain` alone, and the platform implementation is
# injected by the composition layer.
orxnud-platform-fs = { workspace = true }
