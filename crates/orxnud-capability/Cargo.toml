[package]
name = "orxnud-capability"
description = "OpenRayNux capability registry, contracts, and the dispatcher choke point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
orxnud-domain = { workspace = true }
orxnud-policy = { workspace = true }
orxnud-audit = { workspace = true }
# The execution backend: the only place a Tier-1 subprocess can be started. The
# dependency is inward (capability sits above platform-*), so G2 permits it.
orxnud-platform-fs = { workspace = true }
orxnud-platform-sandbox = { workspace = true }
# For the verifier's content digest in durable evidence. blake3 because that is what
# the approval digest already uses, so evidence and approvals speak one dialect.
blake3 = { workspace = true }

[dev-dependencies]
# Dev-only, so the bypass suite can name orxnud_task's public surface and assert the
# engine exposes no dispatcher. This creates no cycle: orxnud-task depends on
# domain/store/policy/audit, never on this crate. Moving this line to [dependencies]
# would reverse the direction and gate G2 would fail with
# "orxnud-task cannot reach orxnud-capability".
orxnud-task = { workspace = true }
# Dev-only, and inward: `orxnud-store` is layer 1 and this crate is layer 5. The
# durability suite (`tests/durable_state.rs`) drives the real governed dispatcher
# against a real migrated SQLite file, because proving that approval consumption and
# the audit journal survive a restart is a property of the *joined* boundary and
# cannot be observed from either crate's own tests.
orxnud-store = { workspace = true }
proptest = { workspace = true }
# The authority boundary is asserted by compiler failures, not by tests that pass: a
# positive test cannot prove an absence. This crate can host them because it already
# depends on `orxnud-policy`, which is where the authority types and their
# `pub(crate)` constructors now live -- and `orxnud-domain` cannot, because depending
# on policy would invert the layer order gate G2 enforces.
trybuild = { workspace = true }

[[bin]]
# The Tier-1 child for `filesystem/write-text`. A binary rather than an extra
# `[[test]]` target (the pattern `orxnud-platform-sandbox` uses for its hostile
# helper) because this one has to exist outside the test harness: the daemon
# executes it as the sandboxed program, so it must be built by a plain
# `cargo build`, not only by `cargo test`.
name = "orxnud-fswrite"
path = "src/bin/orxnud-fswrite.rs"

[[bin]]
# The Tier-1 child for `filesystem/read-text`. A `[[bin]]` for the same reason as
# `orxnud-fswrite`: the daemon executes it as the sandboxed program, so it must exist
# outside the test harness and be built by a plain `cargo build`.
name = "orxnud-fsread"
path = "src/bin/orxnud-fsread.rs"
