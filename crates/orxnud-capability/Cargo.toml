[package]
name = "orxnud-capability"
description = "OpenRayNux capability registry, contracts, and the dispatcher choke point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
orxnud-domain = { workspace = true }
orxnud-policy = { workspace = true }
orxnud-audit = { workspace = true }
# The execution backend: the only place a Tier-1 subprocess can be started. The
# dependency is inward (capability sits above platform-*), so G2 permits it.
orxnud-platform-sandbox = { workspace = true }

[dev-dependencies]
# Dev-only, so the bypass suite can name orxnud_task's public surface and assert the
# engine exposes no dispatcher. This creates no cycle: orxnud-task depends on
# domain/store/policy/audit, never on this crate. Moving this line to [dependencies]
# would reverse the direction and gate G2 would fail with
# "orxnud-task cannot reach orxnud-capability".
orxnud-task = { workspace = true }
# Dev-only, and inward: `orxnud-store` is layer 1 and this crate is layer 5. The
# durability suite (`tests/durable_state.rs`) drives the real governed dispatcher
# against a real migrated SQLite file, because proving that approval consumption and
# the audit journal survive a restart is a property of the *joined* boundary and
# cannot be observed from either crate's own tests.
orxnud-store = { workspace = true }
proptest = { workspace = true }
