[package]
name = "orxnud-platform-fs"
description = "OpenRayNux filesystem platform adapter: path conventions, reserved names, atomic writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# One of exactly three crates permitted to contain cfg(target_os) (CI gate G7).
[dependencies]
# The contract this crate implements, and thiserror for its error type. Both are
# dependencies of an adapter; neither is a platform branch, so this crate stays
# inside the portable-core grep gate's allowed set.
thiserror = { workspace = true }
orxnud-domain = { workspace = true }

# Windows file identity and the actual SQLite main-database handle. These are
# target-specific so a Linux build compiles neither SQLite nor Win32; the `cfg`
# lives here because this crate is one of the three gate G3 permits it in.
# `rusqlite` is already the store's dependency, so the Windows build adds no new
# SQLite version to the graph.
[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.27.0"
