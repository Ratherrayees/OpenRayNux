[package]
name = "orxnud-domain"
description = "OpenRayNux pure domain types and invariants. No I/O, no async, no platform, no storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# ADR-0001/docs-13 §3.1: "ZERO deps beyond serde/thiserror."
# The portable-core gate (G9) builds this crate for wasm32-unknown-unknown;
# adding a dependency that is not pure Rust would break that gate, which is the
# point of the gate.
[dependencies]
serde = { workspace = true }
# DEVIATION (documented in the Phase 1 report): docs-13 §3.1 said "serde/thiserror"
# only. `serde_json::Value` is part of this crate's public API because
# `ProposedStep::params` and `ActionRequest::params` carry *untrusted,
# schema-less* parameters that are validated later against a capability's
# declared schema. The alternative -- an opaque byte blob -- would move the
# canonicalisation and its failure modes out of the type system.
# serde_json is pure Rust, part of the serde project, and builds for
# wasm32-unknown-unknown, so the portable-core gate (G9) is unaffected.
serde_json = { workspace = true }
thiserror = { workspace = true }
# Secret values are wrapped in Zeroizing so they are zeroed on drop (control S9).
# Pure Rust, so the portable-core gate (G9) is unaffected.
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }
