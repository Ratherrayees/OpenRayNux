[package]
name = "orxnud-platform-ipc"
description = "OpenRayNux local IPC transport: a byte-oriented local endpoint, Unix socket on Unix."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# One of the `orxnud-platform-*` crates permitted to contain cfg(target_os) (gate G3).
# The dependency is `tokio` only, and only for the asynchronous socket: a socket is
# an OS facility, and gate G3 is what keeps `cfg` out of everything above this crate.
#
# No internal dependency, deliberately. This crate speaks bytes and knows nothing
# about JSON-RPC; `orxnud-protocol` owns the wire vocabulary and the size bounds.
# Two crates that both knew the wire format would be two definitions of it.
[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }

# Unix-only, and only for the peer-credential syscall that establishes *who a local
# caller is*. `tokio` already depends on `libc` on this platform, so this adds no
# build cost; it names the dependency explicitly rather than relying on a transitive
# one. `libc` supplies `SO_PEERCRED` and `getsockopt(2)`.
#
# This is the crate's first dependency beyond `tokio`, and the reason is specific: peer
# identity cannot be obtained from the safe wrappers, and hand-rolling the `extern "C"`
# declaration to avoid a widely-used, already-vendored crate would trade a vetted
# binding for unowned `unsafe`. The `unsafe` is four lines, confined to `unix.rs`, and
# covered by the crate's own real-socket tests.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
