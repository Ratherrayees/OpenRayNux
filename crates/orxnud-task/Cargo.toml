[package]
name = "orxnud-task"
description = "OpenRayNux task lifecycle types and the ADR-0029 conformance harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Scheduler dependencies for the TP-8/TP-9 property generators. croner is the
# only Rust cron with documented Vixie-compatible DST semantics (ADR-0021, V-22).
croner = { workspace = true }
jiff = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true }
orxnud-domain = { workspace = true }
orxnud-store = { workspace = true }
orxnud-policy = { workspace = true }
orxnud-audit = { workspace = true }

# The Phase 2 engine writes task rows directly (ADR-0006: one writer, one
# connection), and the TP-7 power-loss victim runs a *standalone* script that
# must not go through the engine under test -- otherwise the test would be
# testing the code it is meant to validate.
rusqlite = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }
# `v93_effect_scope.rs` and `v97_proposal_identity.rs` stage a database at a chosen
# schema version to test the migrations that follow it, which needs orxnud-store's
# test-support surface. Resolver 3 keeps a dev-dependency's features out of a
# normal build, so this cannot ship; `orxnud-store`'s
# tests/test_support_feature_is_not_shipped.rs is what holds that.
orxnud-store = { workspace = true, features = ["test-support"] }
