[package]
name = "orxnud-config"
description = "OpenRayNux layered configuration: merge, schema versioning, migration mechanism."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# NOTE: the user-facing config *schema* is Phase 2 (docs-13 §8). This crate
# provides only the mechanism: layer precedence, version stamping, and the
# migration trait. No schema-validation dependency is added, because adding one
# now would be speculative (docs-02 §3).
[dependencies]
serde = { workspace = true }
# The in-memory value form *is* the wire form, so config and the protocol crate
# speak one vocabulary rather than two. `toml` is for parsing config files only.
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
orxnud-domain = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
