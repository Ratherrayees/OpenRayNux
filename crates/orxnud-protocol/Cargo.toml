[package]
name = "orxnud-protocol"
description = "OpenRayNux local wire protocol. The ONLY crate interfaces may depend on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# An interface may depend on this crate and nothing else internal
# (docs-03 §2, IR-2). That is what makes "business logic exists exactly once"
# true rather than aspirational: a GUI cannot reimplement a rule it cannot see.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
orxnud-domain = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
